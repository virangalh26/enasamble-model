# Pipeline parameters tracked by DVC (`dvc params diff` compares them between versions).
data:
  poverty_line: 6966          # Rs per person per month, DCS official (updated) poverty line 2019
  # Scale factors that turn the recorded food / non-food values into a monthly amount.
  # Checked against the DCS published poverty rates (reports/label_check_vs_dcs.csv) once the data is in.
  food_factor: 1.0
  nonfood_factor: 1.0

train:
  seed: 42
  test_share: 0.2             # share of PSUs (survey clusters) held out as the test set
  cv_folds: 5                 # grouped by PSU on the training households

quality_gate:
  min_test_pr_auc: 0.40       # a new model must reach at least this held-out PR-AUC for the poor class
  max_drop: 0.02              # and may not be worse than the current model by more than this
