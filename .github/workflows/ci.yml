name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual "Run workflow" button, e.g. if GitHub ever misses a push event. A successful run on main
  # also triggers Deploy, exactly like a push.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Tests run the whole pipeline on synthetic HIES-shaped files (the real microdata is never in git).
      - name: Run tests (data pipeline, NGBoost, explanations, web app)
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Is a trained model committed?
        id: model
        run: |
          if [ -f models/poverty_targeter.joblib ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "No trained model committed yet, so the image build is skipped."; fi
      - name: Build app image
        if: steps.model.outputs.present == 'true'
        run: docker build -t solar-detector:ci .
      - name: Smoke-test the container
        if: steps.model.outputs.present == 'true'
        run: |
          docker run -d -p 8501:8501 --name app solar-detector:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8501/health; then echo " healthy"; exit 0; fi
            sleep 2
          done
          docker logs app; exit 1
