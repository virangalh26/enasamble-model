name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (feature pipeline + saved-model behaviour)
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build app image
        run: docker build -t solar-detector:ci .
      - name: Smoke-test the container
        run: |
          docker run -d -p 8501:8501 --name app solar-detector:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8501/health; then echo " healthy"; exit 0; fi
            sleep 2
          done
          docker logs app; exit 1
