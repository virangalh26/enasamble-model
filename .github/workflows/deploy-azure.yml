name: Deploy to Azure

# Builds the app image, pushes it to Azure Container Registry and deploys it to an Azure Web App for Containers.
# Runs after CI passes on main, or manually from the Actions tab.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   AZURE_CREDENTIALS   JSON from: az ad sp create-for-rbac --name <name> --role contributor
#                       --scopes /subscriptions/<sub-id>/resourceGroups/<rg> --sdk-auth
# Required repository variables:
#   ACR_NAME            Azure Container Registry name (without .azurecr.io)
#   AZURE_WEBAPP_NAME   Web App name

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Skipped (not failed) until the Azure variables are configured in the repository settings.
    if: ${{ vars.AZURE_WEBAPP_NAME != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/solar-detector:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE }}

      - name: Check the deployed app is healthy
        run: |
          URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/_stcore/health"
          for i in $(seq 1 30); do
            if curl -fs "$URL"; then echo " deployed and healthy"; exit 0; fi
            sleep 10
          done
          echo "App did not become healthy at $URL"; exit 1
