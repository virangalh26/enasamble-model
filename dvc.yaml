# Reproducible pipeline: HIES 2019 microdata -> household table + poverty label -> NGBoost -> explanations.
# `dvc repro` reruns only the stages whose code, data or parameters changed; `dvc.lock` records
# the exact hashes, so every model can be traced to the data and code that produced it.
# The raw files come from DCS Lanka Datta (free registration) and are tracked with `dvc add data/raw/hies2019`.
stages:
  build:
    cmd: python -m src.hies --raw data/raw/hies2019 --out data/processed/households.parquet
    deps:
      - data/raw/hies2019
      - src/hies.py
      - src/features.py
    params:
      - data
    outs:
      - data/processed/households.parquet
    metrics:
      - reports/data_summary.json:
          cache: false
    plots:
      - reports/label_check_vs_dcs.csv:
          cache: false

  train:
    cmd: python -m src.train --data data/processed/households.parquet
    deps:
      - data/processed/households.parquet
      - src/train.py
      - src/features.py
      - src/model.py
      - src/drift.py
    params:
      - data.poverty_line
      - train
    outs:
      # The model stays in git (cache: false) so CI/CD can build the app image without Azure access.
      - models/poverty_targeter.joblib:
          cache: false
      - models/metadata.json:
          cache: false
      - models/reference_stats.json:
          cache: false
      - reports/split.json:
          cache: false
      - reports/best_params.json:
          cache: false
      - reports/ngboost_grid_search.csv:
          cache: false
      - reports/model_comparison.csv:
          cache: false
      - reports/fairness.csv:
          cache: false
      - reports/test_predictions.csv:
          cache: false
    metrics:
      - reports/metrics.json:
          cache: false

  explain:
    cmd: python -m src.explain
    deps:
      - models/poverty_targeter.joblib
      - data/processed/households.parquet
      - reports/split.json
      - src/explain.py
    outs:
      - reports/explain:
          cache: false
